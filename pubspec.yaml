name: ecochain
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Configuração do Ícone (Colada bem no final e alinhada à esquerda)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/eco_house.png"
  min_sdk_android: 21